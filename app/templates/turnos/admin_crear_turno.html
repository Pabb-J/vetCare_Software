{% extends 'base.html' %}
{% block content %}

<style>
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width:600px) { .form-row { grid-template-columns: 1fr; } }
</style>

<div style="max-width: 560px; margin: 0 auto;">
    <h2 style="font-family: 'Playfair Display', serif; color: #4a9b9b; margin-bottom: 0.5rem;">Crear Turno</h2>
    <p style="color: #718096; margin-bottom: 1.5rem; font-size: 0.9rem;">Asigná un turno a un dueño y su mascota con el veterinario y horario deseado.</p>

    <div style="background: white; border-radius: 14px; padding: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.07);">
        <form method="POST">
            <div class="form-group">
                <label>Veterinario</label>
                <select name="veterinario_id" required>
                    <option value="">-- Seleccionar --</option>
                    {% for v in veterinarios %}
                    <option value="{{ v.id }}">Dr/a. {{ v.nombre }} {{ v.apellido }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Dueño</label>
                <select name="dueno_id" id="dueno-select" required>
                    <option value="">-- Seleccionar --</option>
                    {% for d in duenos %}
                    <option value="{{ d.id }}">{{ d.nombre }} {{ d.apellido }} (DNI: {{ d.dni }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Mascota</label>
                <select name="mascota_id" id="mascota-select">
                    <option value="">-- Sin mascota --</option>
                    {% for m in mascotas %}
                    <option value="{{ m.id }}" data-dueno="{{ m.dueno_id }}">{{ m.nombre }} ({{ m.especie }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" name="fecha" required>
                </div>
                <div class="form-group">
                    <label>Horario</label>
                    <input type="time" name="hora" required>
                </div>
            </div>

            <button type="submit">Crear Turno</button>
        </form>
    </div>

    <div style="text-align:center; margin-top:1rem;">
        <a href="{{ url_for('turnos.admin_turnos') }}" style="color:#4a9b9b; text-decoration:none; font-size:0.9rem;">Volver a gestión de turnos</a>
    </div>
</div>

<script>
document.getElementById('dueno-select').addEventListener('change', function() {
    const duenoId = this.value;
    document.querySelectorAll('#mascota-select option').forEach(function(opt) {
        if (opt.value === '') return;
        if (opt.dataset.dueno === duenoId || !opt.dataset.dueno) {
            opt.style.display = 'block';
        } else {
            opt.style.display = 'none';
        }
    });
    // Reset mascota selection if hidden
    const sel = document.getElementById('mascota-select');
    if (sel.selectedOptions[0] && sel.selectedOptions[0].style.display === 'none') {
        sel.value = '';
    }
});
</script>

{% endblock %}
