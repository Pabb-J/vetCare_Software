{% extends 'base.html' %}
{% block content %}

<div class="container">
    <h2>Generar Turnos</h2>

    <div class="flash-messages">
        {% for msg in get_flashed_messages() %}
            <div class="flash">{{ msg }}</div>
        {% endfor %}
    </div>

    <form method="POST">
        <div class="form-group">
            <label>Veterinario</label>
            <select name="veterinario_id" required>
                {% for vet in veterinarios %}
                    <option value="{{ vet.id }}">{{ vet.nombre }} {{ vet.apellido }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Fecha inicio</label>
            <input type="date" name="fecha_inicio" required>
        </div>

        <div class="form-group">
            <label>Fecha fin</label>
            <input type="date" name="fecha_fin" required>
        </div>

        <div class="form-group">
            <label>Hora inicio</label>
            <input type="time" name="hora_inicio" required>
        </div>

        <div class="form-group">
            <label>Hora fin</label>
            <input type="time" name="hora_fin" required>
        </div>

        <div class="form-group">
            <label>Duración de cada turno</label>
            <select name="duracion" required>
                <option value="30">30 minutos</option>
                <option value="45">45 minutos</option>
                <option value="60">1 hora</option>
            </select>
        </div>

        <button type="submit">Generar turnos</button>

        <div class="link-text">
            <a href="{{ url_for('turnos.listar_turnos') }}">Volver</a>
        </div>
    </form>
</div>

{% endblock %}
