{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <h2>✏️ Editar Medicamento</h2>
    <form method="POST">
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" value="{{ medicamento.nombre }}" required>
        </div>
        <div class="form-group">
            <label>Dosis</label>
            <input type="text" name="dosis" value="{{ medicamento.dosis }}" required placeholder="Ej: 250mg">
        </div>
        <div class="form-group">
            <label>Frecuencia</label>
            <input type="text" name="frecuencia" value="{{ medicamento.frecuencia }}" required placeholder="Ej: cada 8 horas">
        </div>
        <div class="form-group">
            <label>Duración</label>
            <input type="text" name="duracion" value="{{ medicamento.duracion or '' }}" placeholder="Ej: 7 días">
        </div>
        <button type="submit">💾 Guardar cambios</button>
    </form>
    <div class="link-text">
        <a href="{{ url_for('veterinario.historia_clinica', mascota_id=medicamento.diagnostico.mascota_id) }}">← Volver a historia clínica</a>
    </div>
</div>
{% endblock %}
