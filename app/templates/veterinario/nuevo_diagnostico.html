{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <h2>🩺 Nuevo Diagnóstico</h2>

    <form method="POST">
        <div class="form-group">
            <label>Mascota</label>
            <select name="mascota_id" required>
                <option value="">-- Seleccioná la mascota --</option>
                {% for m in mascotas %}
                    <option value="{{ m.id }}">{{ m.nombre }} ({{ m.especie }}) — Dueño ID: {{ m.dueno_id }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Descripción del Diagnóstico</label>
            <textarea name="descripcion" rows="4" required
                      style="width:100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; resize: vertical;"></textarea>
        </div>
        <div class="form-group">
            <label>Observaciones (opcional)</label>
            <textarea name="observaciones" rows="3"
                      style="width:100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; resize: vertical;"></textarea>
        </div>
        <button type="submit">✅ Guardar Diagnóstico</button>
    </form>

    <div class="link-text">
        <a href="{{ url_for('veterinario.agenda') }}">← Volver a la agenda</a>
    </div>
</div>
{% endblock %}
