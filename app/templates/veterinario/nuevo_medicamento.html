{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <h2>💉 Registrar Medicamento</h2>
    <p style="color: #666; margin-bottom: 1rem;">
        Para el diagnóstico de: <strong>{{ diagnostico.mascota.nombre }}</strong>
    </p>

    <form method="POST">
        <div class="form-group">
            <label>Nombre del Medicamento</label>
            <input type="text" name="nombre" required placeholder="Ej: Amoxicilina">
        </div>
        <div class="form-group">
            <label>Dosis</label>
            <input type="text" name="dosis" required placeholder="Ej: 250mg">
        </div>
        <div class="form-group">
            <label>Frecuencia</label>
            <input type="text" name="frecuencia" required placeholder="Ej: cada 8 horas">
        </div>
        <div class="form-group">
            <label>Duración</label>
            <input type="text" name="duracion" placeholder="Ej: 7 días">
        </div>
        <button type="submit">✅ Guardar Medicamento</button>
    </form>

    <div class="link-text">
        <a href="{{ url_for('veterinario.historia_clinica', mascota_id=diagnostico.mascota_id) }}">← Volver a historia clínica</a>
    </div>
</div>
{% endblock %}
