{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <h2>✏️ Editar Tratamiento</h2>
    <form method="POST">
        <div class="form-group">
            <label>Descripción</label>
            <textarea name="descripcion" rows="4" required
                style="width:100%; padding:0.65rem 0.9rem; border:1.5px solid #e2e8f0; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:0.95rem; resize:vertical;">{{ tratamiento.descripcion }}</textarea>
        </div>
        <div class="form-group">
            <label>Duración</label>
            <input type="text" name="duracion" value="{{ tratamiento.duracion or '' }}" placeholder="Ej: 10 días">
        </div>
        <div class="form-group">
            <label>Indicaciones</label>
            <textarea name="indicaciones" rows="3"
                style="width:100%; padding:0.65rem 0.9rem; border:1.5px solid #e2e8f0; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:0.95rem; resize:vertical;">{{ tratamiento.indicaciones or '' }}</textarea>
        </div>
        <button type="submit">💾 Guardar cambios</button>
    </form>
    <div class="link-text">
        <a href="{{ url_for('veterinario.historia_clinica', mascota_id=tratamiento.diagnostico.mascota_id) }}">← Volver a historia clínica</a>
    </div>
</div>
{% endblock %}
