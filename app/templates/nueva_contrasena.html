{% extends 'base.html' %}
{% block login_content %}

<div style="max-width:420px;margin:60px auto;padding:0 16px;">
    <div style="background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:32px;">
        <h2 style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px;font-family:'Playfair Display',serif;">
            Nueva contrasena
        </h2>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:24px;">
            Hola <strong>{{ usuario.nombre }}</strong>, ingresa tu nueva contrasena.
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p style="color:#e53935;font-size:12px;margin-bottom:16px;">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label style="font-size:12px;font-weight:600;color:var(--text);display:block;margin-bottom:6px;">
                Nueva contrasena
            </label>
            <input type="password" name="password" required minlength="6"
                style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;
                       font-size:13px;color:var(--text);background:var(--bg);box-sizing:border-box;margin-bottom:14px;">

            <label style="font-size:12px;font-weight:600;color:var(--text);display:block;margin-bottom:6px;">
                Confirmar contrasena
            </label>
            <input type="password" name="confirmar" required minlength="6"
                style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;
                       font-size:13px;color:var(--text);background:var(--bg);box-sizing:border-box;margin-bottom:16px;">

            <button type="submit"
                style="width:100%;padding:11px;background:var(--teal);color:#fff;border:none;
                       border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">
                Guardar contrasena
            </button>
        </form>
    </div>
</div>

{% endblock %}
